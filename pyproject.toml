[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bach"
version = "0.1.0"
description = "Continuación de corales de Bach con encoder-decoder LSTM/GRU/atención"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
markers = ["despliegue: pruebas contra la API desplegada en la EC2 (se omiten si no responde)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
